
name: ReaderApp

options:
  bundleIdPrefix: com.readerapp
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  ReaderApp:
    type: application
    platform: iOS

    sources:
      - path: App
      - path: Views

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.readerapp.ios
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Automatic
