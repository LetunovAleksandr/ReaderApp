

name: ReaderApp

options:
  bundleIdPrefix: com.readerapp
  deploymentTarget:
    iOS: "17.0"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  ReaderApp:
    type: application
    platform: iOS

    sources:
      - path: App
      - path: Views
      - path: Models
      - path: Services

    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.readerapp.ios
        PRODUCT_NAME: ReaderApp
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        CODE_SIGNING_ALLOWED: "NO"
